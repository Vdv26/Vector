<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign Up - LocalPro</title>
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="logo center-logo">
            <img src="./assets/logo.png" alt="Logo">
            <h2>Create an Account</h2>
        </div>
        <form id="signupForm">
            <label>Full Name</label>
            <input type="text" class="inp auth-inp" placeholder="Enter your name" required>
            <label>Email</label>
            <input type="email" class="inp auth-inp" placeholder="Enter your email" required>
            <label>Password</label>
            <input type="password" class="inp auth-inp" placeholder="Create a password" required>
            <button type="submit" class="btn auth-btn">Sign Up</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="login.html">Log In</a></p>
        <p class="auth-switch"><a href="index.html">← Back to Home</a></p>
    </div>
</body>
</html>
