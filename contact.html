<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins&family=Varela+Round&display=swap" rel="stylesheet">
    <title>Contact Us - LocalPro</title>
</head>
<body>
    <div class="m contact-layout">
        <div class="header">
            <h1>Get in Touch</h1>
            <p>Have questions? We're here to help.</p>
            <div class="formSide">
                <form id="contactForm">
                    <label>Full Name</label><br>
                    <input type="text" placeholder="John Doe" class="inp" required><br>
                    <label>Email Address</label><br>
                    <input type="email" placeholder="john@example.com" class="inp" required><br>
                    <label>Message</label><br>
                    <textarea placeholder="How can we help you?" class="Tarea" required></textarea><br>
                    <button type="submit" class="btn">Send Message</button>
                </form>
            </div>
        </div>
    </div>

    </body>
</html>
