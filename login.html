<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login - LocalPro</title>
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="logo center-logo">
            <img src="./assets/logo.png" alt="Logo">
            <h2>Welcome Back</h2>
        </div>
        <form id="loginForm">
            <label>Email</label>
            <input type="email" class="inp auth-inp" placeholder="Enter your email" required>
            <label>Password</label>
            <input type="password" class="inp auth-inp" placeholder="Enter your password" required>
            <button type="submit" class="btn auth-btn">Log In</button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="signup.html">Sign Up</a></p>
        <p class="auth-switch"><a href="index.html">← Back to Home</a></p>
    </div>
</body>
</html>
