<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Libre+Baskerville&family=Poppins&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&family=Ubuntu&family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <title>LocalPro - Point|Click|Done</title>
</head>
<body>
    <div class="nav">
        <div class="logo">
            <img src="Logo.png">
            <p class="name">LocalPro</p>
        </div>
        <div class="home">
            <p>Home</p>
        </div>
        <div class="services">
            <p>Services</p>
        </div>
        <div class="how">
            <p>How It Works</p>
        </div>
        <div class="post">
            <p>Post a job</p>
        </div>
        <div class="contact">
            <p>Contact</p>
        </div>
        <div class="login">
            <button>LogIn</button>
        </div>
        <div class="signup">
            <button>SignUp</button>
        </div>
    </div>
    <div class="section">
        <div class="sec1">
            <div class="trust">
                <p><span class="bull">&bull;&nbsp;</span> By 10000+ customers</p>
            </div>
            <div class="hero">
                <p>Find Trusted <span class="pros">LocalPros</span> for Any Job</p>
            </div>
            <div class="line">
                <p>Connect with verified plumbers, electricians, cleaners, and carpenters in your area. Post a job and get quotes within minutes.</p>
            </div>
        </div>
        
        <div class="asset">
            <img src="asset.png">
        </div>
    </div>
    <div class="info">
        <div class="search">
            <img src="search.svg">
            <input type="text" placeholder="What service do you need ?">
        </div>
        <div class="location">
            <img src="location.svg">
            <input type="text" placeholder="Your Location">
        </div>
        <div class="searchbtn">
            <button>Search</button>
        </div>
    </div>
    
    
</body>
</html>
